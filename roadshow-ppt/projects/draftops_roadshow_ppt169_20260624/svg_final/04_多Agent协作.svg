    <path d="M14 3v4a1 1 0 0 0 1 1h4" />
    <path d="M11.5 21h-4.5a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v5m-5 6h7m-3 -3l3 3l-3 3" />
  </g>
    <text x="780" y="438" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" fill="#E7F2FF" font-weight="800">前端只展示与导出</text>
    <text x="720" y="494" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#E7F2FF">查看证据、风险、备选项，导出 JSON 和项目摘要。</text>
    <text x="720" y="528" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#94A8BC">不开放人工换人、人工调权、人工重排。</text>
  </g>
  <g id="takeaway">
    <path fill="#142231" stroke="#33E18A" d="M258,600 H1022 A10,10 0 0 1 1032,610 V640 A10,10 0 0 1 1022,650 H258 A10,10 0 0 1 248,640 V610 A10,10 0 0 1 258,600 Z" />
    <text x="282" y="632" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#33E18A" font-weight="700">这套流程把“模型可能胡说”的风险，压回到文件证据和脚本验证里。</text>

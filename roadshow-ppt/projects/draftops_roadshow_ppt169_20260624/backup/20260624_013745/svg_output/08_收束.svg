<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="endingLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62B8FF"/>
      <stop offset="1" stop-color="#33E18A"/>
    </linearGradient>
  </defs>
  <g id="background">
    <rect width="1280" height="720" fill="#070B10"/>
    <rect x="82" y="72" width="1116" height="574" rx="22" fill="#101820" stroke="#28455E"/>
  </g>
  <g id="closing-copy">
    <text x="132" y="154" font-family="Microsoft YaHei, Arial, sans-serif" font-size="44" fill="#E7F2FF" font-weight="800">最终交付不是“模型回答”</text>
    <text x="132" y="206" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" fill="#94A8BC">而是一套可提交、可复核、可演示的项目资产包。</text>
    <rect x="132" y="238" width="540" height="5" rx="2.5" fill="url(#endingLine)"/>
    <text x="132" y="304" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#E7F2FF">
      <tspan x="132" dy="0">DraftOps 把 30 顺位预测和 7 个里程碑答案，拆成</tspan>
      <tspan x="132" dy="38">可信数据工程、可复现 Agent 流程和可导出产品界面。</tspan>
    </text>
  </g>
  <g id="pillars">
    <rect x="132" y="400" width="292" height="126" rx="16" fill="#142231" stroke="#33E18A"/>
    <use data-icon="tabler-outline/database" x="166" y="430" width="38" height="38" fill="#33E18A" stroke-width="2"/>
    <text x="222" y="458" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" fill="#33E18A" font-weight="800">可信数据</text>
    <text x="166" y="496" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#94A8BC">官方原始包 + 多层审计产物</text>
    <rect x="494" y="400" width="292" height="126" rx="16" fill="#142231" stroke="#62B8FF"/>
    <use data-icon="tabler-outline/eye" x="528" y="430" width="38" height="38" fill="#62B8FF" stroke-width="2"/>
    <text x="584" y="458" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" fill="#62B8FF" font-weight="800">可解释预测</text>
    <text x="528" y="496" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#94A8BC">证据、风险、适配、备选项</text>
    <rect x="856" y="400" width="292" height="126" rx="16" fill="#142231" stroke="#FFD166"/>
    <use data-icon="tabler-outline/file-export" x="890" y="430" width="38" height="38" fill="#FFD166" stroke-width="2"/>
    <text x="946" y="458" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" fill="#FFD166" font-weight="800">可提交系统</text>
    <text x="890" y="496" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#94A8BC">JSON、brief、答题卡</text>
  </g>
  <g id="final-line">
    <rect x="132" y="570" width="1016" height="50" rx="10" fill="#142231" stroke="#28455E"/>
    <text x="166" y="602" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#E7F2FF" font-weight="700">一句话总结：</text>
    <text x="294" y="602" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#94A8BC">30 picks + 7 answers 能被解释、被审计，并稳定提交。</text>
  </g>
  <g id="footer">
    <text x="64" y="674" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#94A8BC">08 / 08</text>
  </g>
</svg>

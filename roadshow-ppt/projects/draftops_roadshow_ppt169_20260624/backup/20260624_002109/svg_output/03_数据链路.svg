<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#070B10"/>
  <text x="64" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" fill="#E7F2FF" font-weight="800">数据先可信，预测才可信</text>
  <text x="64" y="116" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#94A8BC">官方原始材料只读保存，所有派生产物进入可审计链路</text>
  <rect x="70" y="170" width="190" height="120" rx="12" fill="#142231" stroke="#62B8FF"/>
  <text x="98" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" fill="#E7F2FF" font-weight="700">官方数据包</text>
  <text x="98" y="255" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#94A8BC">数据/ 只读原始区</text>
  <polygon points="286,230 330,210 330,250" fill="#62B8FF"/>
  <rect x="352" y="170" width="190" height="120" rx="12" fill="#142231" stroke="#28455E"/>
  <text x="380" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" fill="#E7F2FF" font-weight="700">raw 登记</text>
  <text x="380" y="255" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#94A8BC">来源、时间、可信度</text>
  <polygon points="568,230 612,210 612,250" fill="#62B8FF"/>
  <rect x="634" y="170" width="190" height="120" rx="12" fill="#142231" stroke="#28455E"/>
  <text x="662" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" fill="#E7F2FF" font-weight="700">normalized</text>
  <text x="662" y="255" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#94A8BC">统一字段和名单</text>
  <polygon points="850,230 894,210 894,250" fill="#62B8FF"/>
  <rect x="916" y="170" width="190" height="120" rx="12" fill="#142231" stroke="#28455E"/>
  <text x="944" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" fill="#E7F2FF" font-weight="700">clean/final</text>
  <text x="944" y="255" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#94A8BC">质检后进入预测</text>
  <rect x="156" y="384" width="970" height="150" rx="18" fill="#101820" stroke="#28455E"/>
  <text x="200" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" fill="#E7F2FF" font-weight="700">当前已验证的关键事实</text>
  <text x="200" y="480" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#E7F2FF">
    <tspan x="200" dy="0">• 锁定预测板：30 个 pick、30 名唯一球员、重复 0</tspan>
    <tspan x="200" dy="36">• 候选与特征：本地答题卡池 124 人，球员特征参考 124 人</tspan>
    <tspan x="200" dy="36">• RAG 索引：5 个索引、1336 个 chunks，支撑架构和证据问答</tspan>
  </text>
  <rect x="64" y="594" width="1152" height="58" rx="10" fill="#142231" stroke="#33E18A"/>
  <text x="92" y="631" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#33E18A" font-weight="700">表达重点：我们不是让模型直接猜，而是先把来源变成结构化证据，再由 Agent 和算法生成预测。</text>
  <text x="64" y="674" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#94A8BC">03 / 08</text>
</svg>

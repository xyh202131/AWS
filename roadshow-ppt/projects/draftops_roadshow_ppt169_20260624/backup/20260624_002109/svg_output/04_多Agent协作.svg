<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#070B10"/>
  <text x="64" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" fill="#E7F2FF" font-weight="800">多 Agent 协作：每个环节只做一件事</text>
  <text x="64" y="116" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#94A8BC">结构化文件交接，Supervisor 统一验收，避免口头结论漂移</text>
  <rect x="70" y="164" width="180" height="106" rx="12" fill="#142231" stroke="#62B8FF"/>
  <text x="96" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#E7F2FF" font-weight="700">A1 数据采集</text>
  <text x="96" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#94A8BC">raw_sources.json</text>
  <rect x="286" y="164" width="180" height="106" rx="12" fill="#142231" stroke="#28455E"/>
  <text x="312" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#E7F2FF" font-weight="700">A2/A3 整理</text>
  <text x="312" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#94A8BC">normalized / clean</text>
  <rect x="502" y="164" width="180" height="106" rx="12" fill="#142231" stroke="#28455E"/>
  <text x="528" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#E7F2FF" font-weight="700">A4/A5 画像</text>
  <text x="528" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#94A8BC">球员与球队偏好</text>
  <rect x="718" y="164" width="180" height="106" rx="12" fill="#142231" stroke="#28455E"/>
  <text x="744" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#E7F2FF" font-weight="700">A6 参数</text>
  <text x="744" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#94A8BC">规则与权重场景</text>
  <rect x="934" y="164" width="180" height="106" rx="12" fill="#142231" stroke="#33E18A"/>
  <text x="960" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#E7F2FF" font-weight="700">A7 预测生成</text>
  <text x="960" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#94A8BC">boards/*.json</text>
  <line x1="250" y1="217" x2="286" y2="217" stroke="#62B8FF" stroke-width="3"/>
  <polygon points="286,217 274,210 274,224" fill="#62B8FF"/>
  <line x1="466" y1="217" x2="502" y2="217" stroke="#62B8FF" stroke-width="3"/>
  <polygon points="502,217 490,210 490,224" fill="#62B8FF"/>
  <line x1="682" y1="217" x2="718" y2="217" stroke="#62B8FF" stroke-width="3"/>
  <polygon points="718,217 706,210 706,224" fill="#62B8FF"/>
  <line x1="898" y1="217" x2="934" y2="217" stroke="#62B8FF" stroke-width="3"/>
  <polygon points="934,217 922,210 922,224" fill="#62B8FF"/>
  <rect x="112" y="340" width="440" height="210" rx="16" fill="#101820" stroke="#28455E"/>
  <text x="148" y="386" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" fill="#E7F2FF" font-weight="700">Supervisor 守住边界</text>
  <text x="148" y="436" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#E7F2FF">
    <tspan x="148" dy="0">• 缺来源退回</tspan>
    <tspan x="148" dy="36">• 字段不完整退回</tspan>
    <tspan x="148" dy="36">• 结构不合法退回</tspan>
    <tspan x="148" dy="36">• 禁止人工换人或重排</tspan>
  </text>
  <rect x="628" y="340" width="440" height="210" rx="16" fill="#101820" stroke="#28455E"/>
  <text x="664" y="386" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" fill="#E7F2FF" font-weight="700">前端只负责展示和导出</text>
  <text x="664" y="436" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#E7F2FF">
    <tspan x="664" dy="0">• 查看 30 顺位预测板</tspan>
    <tspan x="664" dy="36">• 查看证据、风险、备选</tspan>
    <tspan x="664" dy="36">• 导出提交 JSON 和 brief</tspan>
    <tspan x="664" dy="36">• 不开放人工调权或换人</tspan>
  </text>
  <rect x="260" y="596" width="760" height="54" rx="10" fill="#142231" stroke="#33E18A"/>
  <text x="294" y="631" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#33E18A" font-weight="700">如果要改变预测，必须改数据或参数，再完整重跑 board。</text>
  <text x="64" y="674" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#94A8BC">04 / 08</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background">
    <rect width="1280" height="720" fill="#070B10"/>
  </g>
  <g id="header">
    <text x="64" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" fill="#E7F2FF" font-weight="800">AWS/RAG：可回答、能部署、可追溯</text>
    <text x="64" y="116" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#94A8BC">前端展示结果，Lambda/API 和 RAG 层负责只读问答与证据检索。</text>
  </g>
  <g id="top-architecture">
    <rect x="84" y="168" width="190" height="112" rx="14" fill="#142231" stroke="#62B8FF"/>
    <use data-icon="tabler-outline/screen-share" x="110" y="194" width="34" height="34" fill="#62B8FF" stroke-width="2"/>
    <text x="158" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#E7F2FF" font-weight="800">DraftOps 前端</text>
    <text x="110" y="256" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#94A8BC">预测板 / 证据 / 导出</text>
    <line x1="274" y1="224" x2="352" y2="224" stroke="#62B8FF" stroke-width="3"/>
    <polygon points="352,224 338,216 338,232" fill="#62B8FF"/>
    <rect x="352" y="168" width="190" height="112" rx="14" fill="#142231" stroke="#28455E"/>
    <use data-icon="tabler-outline/api" x="378" y="194" width="34" height="34" fill="#62B8FF" stroke-width="2"/>
    <text x="426" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#E7F2FF" font-weight="800">Agent API</text>
    <text x="378" y="256" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#94A8BC">Lambda / local proxy</text>
    <line x1="542" y1="224" x2="620" y2="224" stroke="#62B8FF" stroke-width="3"/>
    <polygon points="620,224 606,216 606,232" fill="#62B8FF"/>
    <rect x="620" y="168" width="190" height="112" rx="14" fill="#142231" stroke="#33E18A"/>
    <use data-icon="tabler-outline/route" x="646" y="194" width="34" height="34" fill="#33E18A" stroke-width="2"/>
    <text x="694" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#E7F2FF" font-weight="800">RAG 检索层</text>
    <text x="646" y="256" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#94A8BC">ranking / MMR / fallback</text>
    <line x1="810" y1="224" x2="888" y2="224" stroke="#62B8FF" stroke-width="3"/>
    <polygon points="888,224 874,216 874,232" fill="#62B8FF"/>
    <rect x="888" y="168" width="190" height="112" rx="14" fill="#142231" stroke="#28455E"/>
    <use data-icon="tabler-outline/brain" x="914" y="194" width="34" height="34" fill="#FFD166" stroke-width="2"/>
    <text x="962" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#E7F2FF" font-weight="800">模型层</text>
    <text x="914" y="256" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#94A8BC">DeepSeek / Bedrock</text>
  </g>
  <g id="storage-row">
    <rect x="126" y="376" width="300" height="150" rx="16" fill="#101820" stroke="#28455E"/>
    <use data-icon="tabler-outline/cloud" x="162" y="410" width="40" height="40" fill="#62B8FF" stroke-width="2"/>
    <text x="222" y="438" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" fill="#E7F2FF" font-weight="800">S3 索引文件</text>
    <text x="162" y="486" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#62B8FF" font-weight="800">5 indexes / 1336 chunks</text>
    <text x="162" y="514" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#94A8BC">board、team、prospect、milestone、architecture</text>
    <rect x="490" y="376" width="300" height="150" rx="16" fill="#101820" stroke="#28455E"/>
    <use data-icon="tabler-outline/server" x="526" y="410" width="40" height="40" fill="#33E18A" stroke-width="2"/>
    <text x="586" y="438" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" fill="#E7F2FF" font-weight="800">DynamoDB</text>
    <text x="526" y="486" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#33E18A" font-weight="800">124 feature records</text>
    <text x="526" y="514" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#94A8BC">球员身体、测量、参考评分和嵌套特征</text>
    <rect x="854" y="376" width="300" height="150" rx="16" fill="#101820" stroke="#28455E"/>
    <use data-icon="tabler-outline/shield-check" x="890" y="410" width="40" height="40" fill="#FFD166" stroke-width="2"/>
    <text x="950" y="438" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" fill="#E7F2FF" font-weight="800">只读护栏</text>
    <text x="890" y="486" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#FFD166" font-weight="800">weak evidence aware</text>
    <text x="890" y="514" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#94A8BC">不直接改代码、换人、提交或覆盖 board</text>
  </g>
  <g id="takeaway">
    <rect x="216" y="590" width="848" height="54" rx="10" fill="#142231" stroke="#33E18A"/>
    <text x="246" y="625" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#33E18A" font-weight="700">路演表述：这是可部署 API 层；没有完整 IaC 前，不夸大成全量云原生平台。</text>
  </g>
  <g id="footer">
    <text x="64" y="674" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#94A8BC">07 / 08</text>
  </g>
</svg>

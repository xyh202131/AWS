<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background">
    <rect width="1280" height="720" fill="#070B10"/>
  </g>
  <g id="header">
    <text x="64" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" fill="#E7F2FF" font-weight="800">多 Agent 协作：分工，而不是群聊</text>
    <text x="64" y="116" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#94A8BC">每个 Agent 只交付结构化文件，Supervisor 用证据和规则统一验收。</text>
  </g>
  <g id="agent-row">
    <rect x="70" y="164" width="166" height="126" rx="14" fill="#142231" stroke="#62B8FF"/>
    <use data-icon="tabler-outline/database" x="96" y="190" width="34" height="34" fill="#62B8FF" stroke-width="2"/>
    <text x="96" y="246" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#E7F2FF" font-weight="800">A1 采集</text>
    <text x="96" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#94A8BC">raw sources</text>
    <rect x="280" y="164" width="166" height="126" rx="14" fill="#142231" stroke="#28455E"/>
    <use data-icon="tabler-outline/layers-intersect" x="306" y="190" width="34" height="34" fill="#62B8FF" stroke-width="2"/>
    <text x="306" y="246" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#E7F2FF" font-weight="800">A2/A3 清洗</text>
    <text x="306" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#94A8BC">normalized / clean</text>
    <rect x="490" y="164" width="166" height="126" rx="14" fill="#142231" stroke="#28455E"/>
    <use data-icon="tabler-outline/brain" x="516" y="190" width="34" height="34" fill="#62B8FF" stroke-width="2"/>
    <text x="516" y="246" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#E7F2FF" font-weight="800">A4/A5 画像</text>
    <text x="516" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#94A8BC">球员与球队偏好</text>
    <rect x="700" y="164" width="166" height="126" rx="14" fill="#142231" stroke="#28455E"/>
    <use data-icon="tabler-outline/adjustments" x="726" y="190" width="34" height="34" fill="#FFD166" stroke-width="2"/>
    <text x="726" y="246" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#E7F2FF" font-weight="800">A6 参数</text>
    <text x="726" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#94A8BC">规则与场景</text>
    <rect x="910" y="164" width="166" height="126" rx="14" fill="#142231" stroke="#33E18A"/>
    <use data-icon="tabler-outline/chart-dots" x="936" y="190" width="34" height="34" fill="#33E18A" stroke-width="2"/>
    <text x="936" y="246" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#E7F2FF" font-weight="800">A7 预测</text>
    <text x="936" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#94A8BC">locked board</text>
    <line x1="236" y1="227" x2="280" y2="227" stroke="#62B8FF" stroke-width="3"/>
    <polygon points="280,227 266,219 266,235" fill="#62B8FF"/>
    <line x1="446" y1="227" x2="490" y2="227" stroke="#62B8FF" stroke-width="3"/>
    <polygon points="490,227 476,219 476,235" fill="#62B8FF"/>
    <line x1="656" y1="227" x2="700" y2="227" stroke="#62B8FF" stroke-width="3"/>
    <polygon points="700,227 686,219 686,235" fill="#62B8FF"/>
    <line x1="866" y1="227" x2="910" y2="227" stroke="#62B8FF" stroke-width="3"/>
    <polygon points="910,227 896,219 896,235" fill="#62B8FF"/>
  </g>
  <g id="guardrails">
    <rect x="126" y="374" width="470" height="176" rx="16" fill="#101820" stroke="#28455E"/>
    <use data-icon="tabler-outline/shield-check" x="162" y="410" width="40" height="40" fill="#33E18A" stroke-width="2"/>
    <text x="222" y="438" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" fill="#E7F2FF" font-weight="800">Supervisor 守边界</text>
    <text x="162" y="494" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#E7F2FF">缺来源、字段不完整、结构不合法，全部退回。</text>
    <text x="162" y="528" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#94A8BC">预测变化只能来自数据、参数、护栏或完整重跑。</text>
    <rect x="684" y="374" width="470" height="176" rx="16" fill="#101820" stroke="#28455E"/>
    <use data-icon="tabler-outline/file-export" x="720" y="410" width="40" height="40" fill="#62B8FF" stroke-width="2"/>
    <text x="780" y="438" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" fill="#E7F2FF" font-weight="800">前端只展示与导出</text>
    <text x="720" y="494" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#E7F2FF">查看证据、风险、备选项，导出 JSON 和 brief。</text>
    <text x="720" y="528" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#94A8BC">不开放人工换人、人工调权、人工重排。</text>
  </g>
  <g id="takeaway">
    <rect x="248" y="600" width="784" height="50" rx="10" fill="#142231" stroke="#33E18A"/>
    <text x="282" y="632" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#33E18A" font-weight="700">这套流程把“模型可能胡说”的风险，压回到文件证据和脚本验证里。</text>
  </g>
  <g id="footer">
    <text x="64" y="674" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#94A8BC">04 / 08</text>
  </g>
</svg>
